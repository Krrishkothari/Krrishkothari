<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img"><title>Driver Sleep Detection alert stages: under 3 seconds is ignored as a blink, at 3 seconds an Arduino cuts the motor relay and sounds a buzzer, at 5 seconds an ESP32 sends a Telegram alert</title><style>@font-face{font-family:'f-mono';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'f-serif';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'f-monob';src:url(data:font/woff2;base64,) format('woff2');}svg{--paper:#FCFFFF;--sky:#0593C6;--pink:#D83995;--ink:#05698F;--rule:#BEE4F1;}.f-paper{fill:var(--paper)}.s-paper{stroke:var(--paper);fill:none}.f-sky{fill:var(--sky)}.s-sky{stroke:var(--sky);fill:none}.f-pink{fill:var(--pink)}.s-pink{stroke:var(--pink);fill:none}.f-ink{fill:var(--ink)}.s-ink{stroke:var(--ink);fill:none}.f-rule{fill:var(--rule)}.s-rule{stroke:var(--rule);fill:none}.t-mono{font-family:'f-mono',Menlo,monospace}.t-serif{font-family:'f-serif',Georgia,serif}.t-monob{font-family:'f-monob',Menlo,monospace}@keyframes play{0%{transform:translateX(0)}68.75%,75%{transform:translateX(781px)}76%,100%{transform:translateX(0)}}.head{animation:play 8s linear infinite}@keyframes lid{0%{transform:scaleY(1)}4%,75%{transform:scaleY(.08)}79%,100%{transform:scaleY(1)}}.lid{transform-box:fill-box;transform-origin:center;animation:lid 8s linear infinite}@keyframes stage1{0%,37%{opacity:.35}37.5%,75%{opacity:1}76%,100%{opacity:.35}}@keyframes stage2{0%,62%{opacity:.35}62.5%,75%{opacity:1}76%,100%{opacity:.35}}.one{animation:stage1 8s linear infinite}.two{animation:stage2 8s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}</style><rect x=".5" y=".5" width="999" height="279" rx="6" stroke="#BEE4F1" fill="#FCFFFF"/><path d="M0 8V6a6 6 0 0 1 6-6H994a6 6 0 0 1 6 6V8Z" class="f-sky"/><text x="44" y="48" font-size="13" letter-spacing="1.5" class="t-mono f-ink ">FIG. 3</text><text x="120" y="48" font-size="14" class="t-mono f-ink ">What happens the longer the driver's eyes stay closed</text><rect x="498" y="104" width="284" height="100" class="f-sky one" style="fill-opacity:.13"/><rect x="782" y="104" width="142" height="100" class="f-sky two" style="fill-opacity:.25"/><text x="88" y="146" font-size="20" class="t-serif f-ink ">Under 3 s</text><text x="88" y="170" font-size="13" class="t-mono f-ink ">Ignored as a normal blink</text><text x="514" y="146" font-size="20" class="t-serif f-ink ">Arduino</text><text x="514" y="170" font-size="13" class="t-mono f-ink ">Cuts the motor relay</text><text x="514" y="188" font-size="13" class="t-mono f-ink ">and sounds a buzzer</text><text x="794" y="146" font-size="20" class="t-serif f-ink ">ESP32</text><text x="794" y="170" font-size="13" class="t-mono f-ink ">Sends a</text><text x="794" y="188" font-size="13" class="t-mono f-ink ">Telegram alert</text><line x1="72" y1="204" x2="924" y2="204" stroke-width="3" class="s-sky" /><line x1="72" y1="204" x2="72" y2="212" stroke-width="1.5" class="s-sky" /><text x="72" y="231" font-size="13" text-anchor="middle" class="t-mono f-ink ">0 s</text><line x1="214" y1="204" x2="214" y2="212" stroke-width="1.5" class="s-sky" /><text x="214" y="231" font-size="13" text-anchor="middle" class="t-mono f-ink ">1 s</text><line x1="356" y1="204" x2="356" y2="212" stroke-width="1.5" class="s-sky" /><text x="356" y="231" font-size="13" text-anchor="middle" class="t-mono f-ink ">2 s</text><line x1="498" y1="204" x2="498" y2="212" stroke-width="3" class="s-sky" /><text x="498" y="231" font-size="13" text-anchor="middle" class="t-monob f-ink ">3 s</text><line x1="640" y1="204" x2="640" y2="212" stroke-width="1.5" class="s-sky" /><text x="640" y="231" font-size="13" text-anchor="middle" class="t-mono f-ink ">4 s</text><line x1="782" y1="204" x2="782" y2="212" stroke-width="3" class="s-sky" /><text x="782" y="231" font-size="13" text-anchor="middle" class="t-monob f-ink ">5 s</text><line x1="924" y1="204" x2="924" y2="212" stroke-width="1.5" class="s-sky" /><text x="924" y="231" font-size="13" text-anchor="middle" class="t-mono f-ink ">6 s</text><text x="44" y="262" font-size="13" class="t-mono f-ink ">Opening the eyes restores motor power and silences the buzzer.</text><g class="head motion"><line x1="72" y1="90" x2="72" y2="104" stroke-width="2" class="s-sky"/><circle cx="72" cy="204" r="7" class="f-pink"/><g transform="translate(72 74)"><g class="lid"><path d="M-22 0C-12-14 12-14 22 0C12 14-12 14-22 0Z" stroke-width="2.5" vector-effect="non-scaling-stroke" class="s-sky" style="fill:var(--paper)"/><circle r="6" class="f-sky"/></g></g></g></svg>