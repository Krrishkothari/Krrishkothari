<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="571" viewBox="0 0 1000 571" role="img"><title>Seating chart with one seat per tracked cinema: 42 cinemas in 17 locations, 17 Devgn Cinex screens and 25 competitors</title><style>@font-face{font-family:'f-display';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'f-mono';src:url(data:font/woff2;base64,) format('woff2');}svg{--paper:#FCFFFF;--sky:#0593C6;--pink:#D83995;--ink:#05698F;--rule:#BEE4F1;}.f-paper{fill:var(--paper)}.s-paper{stroke:var(--paper);fill:none}.f-sky{fill:var(--sky)}.s-sky{stroke:var(--sky);fill:none}.f-pink{fill:var(--pink)}.s-pink{stroke:var(--pink);fill:none}.f-ink{fill:var(--ink)}.s-ink{stroke:var(--ink);fill:none}.f-rule{fill:var(--rule)}.s-rule{stroke:var(--rule);fill:none}.t-display{font-family:'f-display',Georgia,serif}.t-mono{font-family:'f-mono',Menlo,monospace}@keyframes seat{from{opacity:0;transform:translateY(6px)}}.row{animation:seat .55s ease-out backwards}@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}</style><rect x=".5" y=".5" width="999" height="570" rx="6" stroke="#BEE4F1" fill="#FCFFFF"/><path d="M0 8V6a6 6 0 0 1 6-6H994a6 6 0 0 1 6 6V8Z" class="f-sky"/><path d="M6 0H360V196H0V6a6 6 0 0 1 6-6Z" class="f-sky"/><text x="44" y="100" font-size="54" letter-spacing="-1" class="t-display f-paper ">42 cinemas</text><text x="44" y="156" font-size="54" letter-spacing="-1" class="t-display f-paper ">17 locations</text><text x="44" y="236" font-size="13" letter-spacing="1.5" class="t-mono f-ink ">FIG. 1</text><text x="44" y="268" font-size="14" class="t-mono f-ink ">Each seat is one cinema the</text><text x="44" y="290" font-size="14" class="t-mono f-ink ">DevgnCineX scraper checks</text><text x="44" y="312" font-size="14" class="t-mono f-ink ">on BookMyShow every hour.</text><path d="M2 16V6a5 5 0 0 1 5-5h20a5 5 0 0 1 5 5v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z" transform="translate(44 356)" class="f-sky"/><text x="88" y